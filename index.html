<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- DNS Prefetch for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://texasspinepain.com" />
    
    <!-- Preconnect External Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Non-blocking Google Fonts: reduced weights (300 removed, only used weights) -->
    <link 
      rel="preload" 
      as="style" 
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" 
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" />
    </noscript>

    <!-- Preload Critical LCP Hero Image - mobile sized -->
    <link rel="preload" as="image" href="/hero-slide-1.webp" fetchpriority="high" type="image/webp"
      media="(min-width: 768px)" />
    <!-- Mobile gets a smaller hero for faster LCP -->
    <link rel="preload" as="image" href="/hero-slide-1-mobile.webp" fetchpriority="high" type="image/webp"
      media="(max-width: 767px)" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="https://texasspinepain.com/wp-content/uploads/2024/11/logo.webp" />

    <!-- Critical above-fold CSS: prevent FOUC -->
    <style>
      body { margin: 0; background: #0b192b; }
      #root { min-height: 100dvh; }
      .hero-bg { background-color: #0b192b; }
    </style>
    
    <!-- Fallback Meta Tags (In case JS fails) -->
    <title>Spine and Pain Institute of Texas</title>
    <meta name="description" content="Expert pain management in Dallas with Dr. Pritesh Patel, DO." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
